stages:
  - test
  - deploy
  - collect

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-deps
  paths:
    - .cache/pip/

# ── Test (every push) ─────────────────────────────────────────────────────────
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt -q
  script:
    - python -c "from github_client import search_repos, scrape_trending; print('github_client OK')"
    - python -c "from gitlab_client import search_gitlab_repos; print('gitlab_client OK')"
    - python -c "from perplexity_client import enrich_repos; print('perplexity_client OK')"
    - python -c "from arxiv_client import search_papers; print('arxiv_client OK')"
    - python -c "from db import init_db, get_stats; init_db(); print('db OK')"
    - python -c "from score import compute_score, is_breakout; print('score OK')"
    - python -c "from server import app; print('server OK')"
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Deploy to Railway (main branch, only when RAILWAY_TOKEN is set) ───────────
deploy:
  stage: deploy
  image: node:20-slim
  before_script:
    - npm install -g @railway/cli --quiet
  script:
    - |
      if [ -z "$RAILWAY_TOKEN" ]; then
        echo "RAILWAY_TOKEN not set — skipping deploy. Add it in GitLab CI/CD variables."
        exit 0
      fi
    - railway up --detach --service starpulse
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
  environment:
    name: production
    url: $RAILWAY_PUBLIC_URL

# ── Daily collect (cron — set in GitLab: Settings → CI/CD → Schedules → 0 3 * * *) ──
daily-collect:
  stage: collect
  image: alpine/curl:latest
  script:
    - |
      if [ -z "$RAILWAY_PUBLIC_URL" ] || [ -z "$ADMIN_SECRET" ]; then
        echo "RAILWAY_PUBLIC_URL or ADMIN_SECRET not set — skipping collect trigger."
        exit 0
      fi
      echo "Triggering daily collect on $RAILWAY_PUBLIC_URL ..."
      HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
        "${RAILWAY_PUBLIC_URL}/api/admin/collect?secret=${ADMIN_SECRET}&mode=daily")
      echo "Response: HTTP $HTTP"
      [ "$HTTP" = "200" ] || exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
