stages:
  - test
  - deploy
  - collect

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip-deps
  paths:
    - .cache/pip/

# ── Test (every push) ─────────────────────────────────────────────────────────
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt -q
  script:
    - python -c "from github_client import search_repos, scrape_trending; print('github_client OK')"
    - python -c "from gitlab_client import search_gitlab_repos; print('gitlab_client OK')"
    - python -c "from perplexity_client import enrich_repos; print('perplexity_client OK')"
    - python -c "from arxiv_client import search_papers; print('arxiv_client OK')"
    - python -c "from db import init_db, get_stats; init_db(); print('db OK')"
    - python -c "from score import compute_score, is_breakout; print('score OK')"
    - python -c "from server import app; print('server OK')"
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Deploy to Railway (main branch only) ──────────────────────────────────────
deploy:
  stage: deploy
  image: node:20-slim
  before_script:
    - npm install -g @railway/cli --quiet
  script:
    - railway up --detach --service starpulse
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: $RAILWAY_PUBLIC_URL

# ── Daily collect (cron schedule — set in GitLab UI: 0 3 * * *) ──────────────
# GitLab: Settings → CI/CD → Pipeline schedules → Add → "0 3 * * *" on main
daily-collect:
  stage: collect
  image: alpine/curl:latest
  script:
    - |
      echo "Triggering daily collect on Railway..."
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        "${RAILWAY_PUBLIC_URL}/api/admin/collect?secret=${ADMIN_SECRET}&mode=daily")
      if [ "$STATUS" = "200" ]; then
        echo "Daily collect started successfully"
      else
        echo "Collect trigger failed with HTTP $STATUS"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
