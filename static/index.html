<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarPulse — Top 100 GitHub Repos</title>
  <style>
    :root {
      --bg:     #0d1117; --bg2: #161b22; --bg3: #010409;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --green:  #3fb950; --blue: #58a6ff; --orange: #f0883e;
      --purple: #bc8cff; --yellow: #e3b341; --red: #ff7b72;
      --accent: #1f6feb; --gold: #e3b341; --silver: #8b949e; --bronze: #f0883e;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px}

    /* ── HEADER ── */
    .hdr{
      height:50px;display:flex;align-items:center;gap:14px;padding:0 20px;
      background:var(--bg3);border-bottom:1px solid var(--border);
      position:fixed;top:0;left:0;right:0;z-index:300;
    }
    .logo{font-size:17px;font-weight:900;display:flex;align-items:center;gap:7px}
    .logo .star{color:var(--gold)}
    .tagline{font-size:11px;color:var(--muted);white-space:nowrap}
    .live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

    .hdr-search{flex:1;max-width:280px;position:relative}
    .hdr-search input{
      width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);
      padding:6px 10px 6px 30px;border-radius:6px;font-size:12px;outline:none;
    }
    .hdr-search input:focus{border-color:var(--blue)}
    .hdr-search::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

    .hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .stat-chip{font-size:11px;color:var(--muted);background:var(--bg2);
      border:1px solid var(--border);padding:4px 10px;border-radius:12px;white-space:nowrap}
    .stat-chip b{color:var(--text)}
    .btn{background:var(--bg2);border:1px solid var(--border);color:var(--muted);
      padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
    .btn:hover{border-color:var(--blue);color:var(--blue)}
    .btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

    /* ── NAV TABS ── */
    .nav{
      height:38px;display:flex;align-items:center;gap:4px;padding:0 20px;
      background:var(--bg3);border-bottom:1px solid var(--border);
      position:fixed;top:50px;left:0;right:0;z-index:299;overflow-x:auto;
    }
    .nav::-webkit-scrollbar{height:3px}
    .nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .ntab{
      padding:5px 13px;border-radius:5px;font-size:11px;font-weight:600;
      cursor:pointer;border:1px solid transparent;color:var(--muted);
      white-space:nowrap;transition:all .12s;flex-shrink:0;
    }
    .ntab:hover{background:var(--bg2);color:var(--text)}
    .ntab.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .ntab.breakout-tab{color:var(--red)}
    .ntab.breakout-tab.active{background:#3d1515;border-color:var(--red);color:var(--red)}
    .nav-sep{width:1px;height:18px;background:var(--border);margin:0 4px;flex-shrink:0}

    /* ── PAGE ── */
    .page{position:fixed;top:88px;bottom:0;left:0;right:0;overflow-y:auto;padding:18px 20px 30px}

    /* ── TOP10 VIEW ── */
    .cat-block{margin-bottom:36px}
    .cat-hdr{
      display:flex;align-items:center;gap:10px;margin-bottom:12px;
      padding-bottom:9px;border-bottom:1px solid var(--border);
    }
    .cat-icon{font-size:18px;line-height:1}
    .cat-title{font-size:15px;font-weight:800}
    .cat-meta{margin-left:auto;display:flex;align-items:center;gap:8px}
    .cat-pill{
      font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;
      background:var(--bg2);border:1px solid var(--border);color:var(--muted);
    }
    .cat-pill.stars{color:var(--yellow);border-color:rgba(227,179,65,.25);background:rgba(227,179,65,.05)}
    .cat-pill.vel{color:var(--green);border-color:rgba(63,185,80,.25);background:rgba(63,185,80,.05)}
    .cat-see-more{
      font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;cursor:pointer;
      border:1px solid var(--border);color:var(--blue);background:transparent;
      transition:all .12s;text-decoration:none;
    }
    .cat-see-more:hover{background:rgba(88,166,255,.08);border-color:var(--blue)}

    /* repo list inside a category */
    .repo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}

    /* ── REPO CARD ── */
    .rcard{
      background:var(--bg2);border:1px solid var(--border);border-radius:8px;
      padding:11px 13px 10px;display:flex;flex-direction:column;gap:6px;
      text-decoration:none;color:inherit;transition:border-color .14s,transform .14s,box-shadow .14s;
      position:relative;
    }
    .rcard:hover{border-color:rgba(88,166,255,.5);transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.5)}
    .rcard.r1{border-top:2px solid var(--gold)}
    .rcard.r2{border-top:2px solid var(--silver)}
    .rcard.r3{border-top:2px solid var(--bronze)}
    .rcard.bo{border-left:2px solid var(--red)}

    .rc-top{display:flex;align-items:center;gap:7px;min-width:0}
    .rc-rank{
      font-size:13px;font-weight:900;flex-shrink:0;width:26px;text-align:center;
    }
    .r1 .rc-rank{color:var(--gold)} .r2 .rc-rank{color:var(--silver)} .r3 .rc-rank{color:var(--bronze)}
    .rc-rank.other{color:var(--muted);font-size:11px}
    .av{width:17px;height:17px;border-radius:50%;flex-shrink:0}
    .rc-name{font-size:12px;font-weight:700;color:var(--blue);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .bo-badge{font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;
      background:rgba(255,123,114,.12);color:var(--red);border:1px solid rgba(255,123,114,.25);flex-shrink:0}
    .lang-dot{font-size:10px;padding:2px 7px;border-radius:10px;flex-shrink:0;white-space:nowrap}

    .rc-desc{font-size:11px;color:var(--muted);line-height:1.45;
      display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

    /* signal bar */
    .rc-sig{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .sig{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
    .sig b{color:var(--text)}
    .sig.stars b{color:var(--yellow)}
    .sig.vel b{color:var(--green)}
    .sig.score b{color:var(--purple)}
    .sig.forks b{color:var(--blue)}
    .vel-badge{
      font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;
      background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.2)
    }
    .vel-badge.hot{background:rgba(255,123,114,.1);color:var(--red);border-color:rgba(255,123,114,.2)}

    /* why row */
    .rc-why{
      font-size:10px;color:var(--muted);background:rgba(31,111,235,.05);
      border:1px solid rgba(31,111,235,.12);border-radius:4px;
      padding:4px 8px;line-height:1.4;
    }

    /* ── SKELETON ── */
    .sk{background:linear-gradient(90deg,var(--bg2) 25%,#1c2128 50%,var(--bg2) 75%);
      background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:100px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-cat{height:28px;width:200px;margin-bottom:12px;border-radius:6px}

    /* ── CONTRIBUTORS ── */
    .contrib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
    .ccard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
      padding:10px 13px;display:flex;align-items:center;gap:10px}
    .crank{font-size:12px;font-weight:800;color:var(--muted);width:28px;text-align:right;flex-shrink:0}
    .cinfo{flex:1;min-width:0}
    .cname{font-size:12px;font-weight:700;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cmeta{font-size:10px;color:var(--muted);margin-top:2px}
    .cstars{font-size:12px;font-weight:700;color:var(--yellow);white-space:nowrap}

    /* ── PAPERS ── */
    .papers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
    .pcard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
      padding:12px 14px;text-decoration:none;color:inherit;display:block;transition:border-color .14s}
    .pcard:hover{border-color:var(--yellow)}
    .pt{font-size:12px;font-weight:700;line-height:1.4;margin-bottom:4px}
    .pa{font-size:10px;color:var(--muted);margin-bottom:6px}
    .pn{font-size:11px;color:var(--yellow);background:rgba(227,179,65,.07);
      padding:5px 8px;border-radius:4px;line-height:1.4;margin-bottom:6px}
    .pbadge{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}

    /* ── BREAKOUTS ── */
    .breakout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}

    /* ── LIVE / REAL-TIME ── */
    .live-hdr{
      display:flex;align-items:center;gap:10px;margin-bottom:14px;
      padding:10px 14px;background:rgba(255,123,114,.04);
      border:1px solid rgba(255,123,114,.2);border-radius:8px;
    }
    .live-title{font-size:14px;font-weight:800;color:var(--red)}
    .live-sub{font-size:11px;color:var(--muted);margin-left:auto}
    .live-refresh{font-size:10px;color:var(--green);margin-left:8px}
    .delta-badge{
      display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;
      border-radius:10px;white-space:nowrap;
    }
    .delta-pos{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.25)}
    .delta-zero{background:var(--bg2);color:var(--muted);border:1px solid var(--border)}
    .delta-6h{background:rgba(88,166,255,.1);color:var(--blue);border:1px solid rgba(88,166,255,.2)}
    .ntab.live-tab{color:var(--red)}
    .ntab.live-tab.active{background:rgba(61,21,21,.8);border-color:var(--red);color:var(--red)}

    /* ── TIMELINE / DATE PICKER ── */
    .date-bar{
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      margin-bottom:18px;padding:12px 14px;
      background:var(--bg2);border:1px solid var(--border);border-radius:8px;
    }
    .date-bar label{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
    .date-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
    .dchip{
      font-size:11px;padding:4px 10px;border-radius:10px;cursor:pointer;
      border:1px solid var(--border);color:var(--muted);background:transparent;
      transition:all .12s;white-space:nowrap;
    }
    .dchip:hover{border-color:var(--blue);color:var(--blue)}
    .dchip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
    .dchip.today{border-color:var(--green);color:var(--green)}
    .dchip.today.active{background:var(--green);border-color:var(--green);color:#0d1117}
    .tl-meta{font-size:11px;color:var(--muted);margin-bottom:10px}
    .tl-meta b{color:var(--text)}

    /* ── EMPTY ── */
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty .ei{font-size:40px;margin-bottom:10px}
    .empty h3{color:var(--text);font-size:15px;margin-bottom:6px}

    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

    @media(max-width:600px){.repo-list,.contrib-grid,.papers-grid,.breakout-grid{grid-template-columns:1fr}
      .tagline{display:none}}
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo"><span class="star">★</span> StarPulse</div>
  <div class="live-dot"></div>
  <span class="tagline">Top 100 GitHub repos across the 10 hottest topics</span>

  <div class="hdr-search">
    <input type="text" id="q" placeholder="Search repos…" autocomplete="off">
  </div>

  <div class="hdr-right">
    <div class="stat-chip" id="statChip">Loading…</div>
    <button class="btn" onclick="hardRefresh()">⟳ Refresh</button>
  </div>
</header>

<!-- NAV -->
<nav class="nav" id="nav">
  <button class="ntab active" data-view="top10" onclick="setView('top10',this)">🏆 Top 10 × 10</button>
  <div class="nav-sep"></div>
  <button class="ntab live-tab" data-view="live" onclick="setView('live',this)">🔴 Live</button>
  <button class="ntab breakout-tab" data-view="breakouts" onclick="setView('breakouts',this)">🚀 Breakouts</button>
  <button class="ntab" data-view="contributors" onclick="setView('contributors',this)">👑 Contributors</button>
  <button class="ntab" data-view="papers" onclick="setView('papers',this)">📄 Papers</button>
  <button class="ntab" data-view="timeline" onclick="setView('timeline',this)">📅 Timeline</button>
  <div class="nav-sep"></div>
  <!-- category quick-jumps populated by JS -->
  <span id="catTabs"></span>
</nav>

<!-- PAGE -->
<div class="page" id="page"></div>

<script>
const LANG_CLR = {
  Python:'#3572A5',JavaScript:'#f1e05a',TypeScript:'#3178c6',Go:'#00ADD8',
  Rust:'#dea584',Java:'#b07219','C++':'#f34b7d',C:'#555555',Ruby:'#701516',
  Swift:'#F05138',Kotlin:'#A97BFF',Dart:'#00B4AB',PHP:'#4F5D95',Shell:'#89e051',
  HTML:'#e34c26',CSS:'#563d7c',Vue:'#4FC08D','C#':'#178600',Elixir:'#6e4a7e',
};

let currentView = 'top10';
let top10Data   = null;   // cached API result
let searchTimer = null;

function fmt(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n/1e6).toFixed(1)+'M';
  if (n >= 1000)    return (n/1000).toFixed(1)+'k';
  return String(n);
}

function rankLabel(r) {
  return r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : `#${r}`;
}
function rankClass(r) {
  return r === 1 ? 'r1' : r === 2 ? 'r2' : r === 3 ? 'r3' : '';
}

// ── REPO CARD (dense, signal-rich) ──────────────────────────────────────────
function repoCard(r) {
  const lc  = LANG_CLR[r.language] || '#8b949e';
  const lang = r.language
    ? `<span class="lang-dot" style="color:${lc};background:${lc}18;border:1px solid ${lc}30">● ${r.language}</span>` : '';
  const bo  = r.is_breakout ? '<span class="bo-badge">🚀 BREAKOUT</span>' : '';
  const vel = r.delta_7d > 0
    ? `<span class="vel-badge ${r.delta_7d>2000?'hot':''}">▲ ${fmt(r.delta_7d)}/wk</span>` : '';
  const why = r.why
    ? `<div class="rc-why">💡 ${r.why}</div>` : '';

  return `
  <a class="rcard ${rankClass(r.rank)} ${r.is_breakout?'bo':''}" href="${r.url}" target="_blank" rel="noopener noreferrer">
    <div class="rc-top">
      <span class="rc-rank ${r.rank>3?'other':''}">${rankLabel(r.rank)}</span>
      <img class="av" src="${r.owner_avatar}" loading="lazy" onerror="this.remove()">
      <span class="rc-name">${r.full_name}</span>
      ${bo}${lang}
    </div>
    <div class="rc-desc">${r.description || '<em style="opacity:.4">No description</em>'}</div>
    <div class="rc-sig">
      <span class="sig stars">⭐ <b>${fmt(r.stars)}</b></span>
      <span class="sig forks">🍴 <b>${fmt(r.forks)}</b></span>
      ${r.open_issues>0?`<span class="sig">🐛 <b>${fmt(r.open_issues)}</b></span>`:''}
      <span class="sig score">⚡ <b>${r.score?.toFixed(1)||'—'}</b></span>
      ${vel}
    </div>
    ${why}
  </a>`;
}

// ── TOP 10 × 10 VIEW ────────────────────────────────────────────────────────
function renderTop10(data) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let html = '';
  let total = 0;

  for (const cat of data) {
    let repos = cat.repos;
    if (q) repos = repos.filter(r =>
      (r.full_name||'').toLowerCase().includes(q) ||
      (r.description||'').toLowerCase().includes(q) ||
      (r.language||'').toLowerCase().includes(q)
    );
    if (q && !repos.length) continue;
    total += repos.length;

    const velPill = cat.velocity_7d > 0
      ? `<span class="cat-pill vel">▲ ${fmt(cat.velocity_7d)}/wk</span>` : '';

    html += `
    <div class="cat-block" id="cat-${cat.id}">
      <div class="cat-hdr">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title">${cat.label}</span>
        <div class="cat-meta">
          <span class="cat-pill stars">⭐ ${fmt(cat.total_stars)} total</span>
          <span class="cat-pill">${cat.total_repos} repos in library</span>
          ${velPill}
          <a class="cat-see-more" href="#" onclick="loadCategory('${cat.id}');return false">
            See all ${cat.total_repos} →
          </a>
        </div>
      </div>
      <div class="repo-list">
        ${repos.map(r => repoCard(r)).join('')}
      </div>
    </div>`;
  }

  if (!html) html = `<div class="empty"><div class="ei">🔭</div><h3>No results for "${q}"</h3></div>`;
  document.getElementById('page').innerHTML = html;
  document.getElementById('statChip').innerHTML = `<b>${total}</b> repos shown`;

  // Build category nav tabs from data
  const tabHtml = data.map(c =>
    `<button class="ntab" data-view="cat-${c.id}" onclick="scrollToCat('${c.id}',this)">${c.icon} ${c.label}</button>`
  ).join('');
  document.getElementById('catTabs').innerHTML = tabHtml;
}

function scrollToCat(id, el) {
  if (currentView !== 'top10') { setView('top10', document.querySelector('[data-view=top10]')); }
  setTimeout(() => {
    const el2 = document.getElementById('cat-' + id);
    if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

// ── CATEGORY FULL VIEW ───────────────────────────────────────────────────────
async function loadCategory(catId) {
  setPageLoading(6);
  try {
    const resp = await fetch(`/api/trending?category=${catId}&period=week&sort=score&limit=50`);
    const j    = await resp.json();
    const repos = (j.data || []).map((r, i) => ({ ...r, rank: i+1, why: makeWhy(r) }));
    const cat   = top10Data?.data?.find(c => c.id === catId);
    const label = cat ? `${cat.icon} ${cat.label}` : catId;

    let html = `<div class="cat-block">
      <div class="cat-hdr">
        <span class="cat-title" style="font-size:16px">${label}</span>
        <div class="cat-meta">
          <span class="cat-pill stars">⭐ ${fmt(cat?.total_stars||0)}</span>
          <button class="cat-see-more" onclick="setView('top10',document.querySelector('[data-view=top10]'))">← Back to Top 10</button>
        </div>
      </div>
      <div class="repo-list">${repos.map(r=>repoCard(r)).join('')}</div>
    </div>`;
    document.getElementById('page').innerHTML = html;
    document.getElementById('statChip').innerHTML = `<b>${repos.length}</b> repos`;
  } catch(e) {
    document.getElementById('page').innerHTML = `<div class="empty"><div class="ei">⚠️</div><h3>${e.message}</h3></div>`;
  }
}

function makeWhy(r) {
  if (r.insight) return r.insight;
  const parts = [];
  if (r.is_breakout)     parts.push(`🚀 Breakout — ▲${fmt(r.delta_7d)} stars this week`);
  if (r.delta_7d > 500)  parts.push(`▲${fmt(r.delta_7d)}/wk momentum`);
  if (r.forks > 20000)   parts.push(`🍴 ${fmt(r.forks)} forks — devs build on it`);
  else if (r.forks > 5000) parts.push(`🍴 ${fmt(r.forks)} forks`);
  if (r.stars > 100000)  parts.push(`⭐ ${fmt(r.stars)} — industry standard`);
  else if (r.stars > 50000) parts.push(`⭐ ${fmt(r.stars)} — widely adopted`);
  if (!parts.length)     parts.push(`Score ${r.score?.toFixed(1)||'—'} composite ranking`);
  return parts.slice(0,2).join(' · ');
}

// ── BREAKOUTS ────────────────────────────────────────────────────────────────
async function loadBreakouts() {
  setPageLoading(4);
  const resp = await fetch('/api/breakouts?limit=50');
  const j    = await resp.json();
  const repos = (j.data||[]).map((r,i)=>({...r,rank:i+1,why:makeWhy(r)}));
  if (!repos.length) {
    document.getElementById('page').innerHTML = `<div class="empty"><div class="ei">🚀</div><h3>No breakouts yet — check back tomorrow</h3></div>`;
    return;
  }
  document.getElementById('page').innerHTML = `
    <div class="cat-hdr" style="margin-bottom:14px">
      <span class="cat-icon">🚀</span>
      <span class="cat-title">Breakout Repos — gaining 15%+ stars this week</span>
      <div class="cat-meta"><span class="cat-pill">${repos.length} breakouts</span></div>
    </div>
    <div class="breakout-grid">${repos.map(r=>repoCard(r)).join('')}</div>`;
  document.getElementById('statChip').innerHTML = `<b>${repos.length}</b> breakouts`;
}

// ── CONTRIBUTORS ─────────────────────────────────────────────────────────────
async function loadContributors() {
  setPageLoading(4);
  const resp = await fetch('/api/contributors?limit=100');
  const j    = await resp.json();
  const cs   = j.data||[];
  const html = cs.map((c,i) => {
    const rank = i+1;
    const rl   = rank<=3?['🥇','🥈','🥉'][rank-1]:`#${rank}`;
    const top  = c.top_repo?.split('/')[1]||'';
    return `<div class="ccard">
      <div class="crank">${rl}</div>
      <div class="cinfo">
        <div class="cname"><a href="https://github.com/${c.owner}" target="_blank" style="color:var(--blue);text-decoration:none">${c.owner}</a></div>
        <div class="cmeta">${c.repo_count} repos in library${top?` · top: ${top}`:''}</div>
      </div>
      <div class="cstars">⭐ ${fmt(c.total_stars)}</div>
    </div>`;
  }).join('');
  document.getElementById('page').innerHTML = `
    <div class="cat-hdr" style="margin-bottom:14px">
      <span class="cat-icon">👑</span>
      <span class="cat-title">Top Contributors — orgs & developers by total star power</span>
      <div class="cat-meta"><span class="cat-pill">${cs.length} contributors</span></div>
    </div>
    <div class="contrib-grid">${html}</div>`;
  document.getElementById('statChip').innerHTML = `<b>${cs.length}</b> contributors`;
}

// ── PAPERS ───────────────────────────────────────────────────────────────────
async function loadPapers() {
  setPageLoading(3);
  const resp = await fetch('/api/papers?category=all&period=week');
  const j    = await resp.json();
  const ps   = j.data||[];
  const html = ps.map(p => {
    const note = p.why_notable||p.abstract||'';
    return `<a class="pcard" href="${p.url}" target="_blank" rel="noopener noreferrer">
      <div class="pt">${p.title}</div>
      <div class="pa">${p.authors||''}</div>
      ${note?`<div class="pn">${note.slice(0,200)}${note.length>200?'…':''}</div>`:''}
      <div><span class="pbadge">${p.source==='arxiv'?'arXiv':'Perplexity'}</span></div>
    </a>`;
  }).join('');
  document.getElementById('page').innerHTML = `
    <div class="cat-hdr" style="margin-bottom:14px">
      <span class="cat-icon">📄</span><span class="cat-title">Trending Research Papers</span>
    </div>
    <div class="papers-grid">${html||'<div class="empty"><div class="ei">📄</div><h3>No papers yet</h3></div>'}</div>`;
  document.getElementById('statChip').innerHTML = `<b>${ps.length}</b> papers`;
}

// ── VIEW CONTROLLER ──────────────────────────────────────────────────────────
function setPageLoading(n=8) {
  document.getElementById('page').innerHTML =
    Array(n).fill('<div class="sk" style="height:100px;margin-bottom:8px"></div>').join('');
}

async function setView(view, el) {
  currentView = view;
  document.querySelectorAll('.ntab').forEach(t=>t.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('q').value = '';

  if (view === 'top10') {
    await loadTop10();
  } else if (view === 'breakouts') {
    await loadBreakouts();
  } else if (view === 'contributors') {
    await loadContributors();
  } else if (view === 'papers') {
    await loadPapers();
  } else if (view === 'timeline') {
    await loadTimeline();
  } else if (view === 'live') {
    await loadLive();
  }
}

async function loadTop10(force=false) {
  if (top10Data && !force) { renderTop10(top10Data.data); return; }
  setPageLoading(8);
  try {
    const resp = await fetch('/api/top10' + (force?'?bust='+Date.now():''));
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    top10Data = await resp.json();
    renderTop10(top10Data.data);
    // also update stats bar
    loadStats();
  } catch(e) {
    document.getElementById('page').innerHTML =
      `<div class="empty"><div class="ei">⚠️</div><h3>${e.message}</h3>
       <p style="margin-top:8px">Make sure the server is running on :8080</p></div>`;
  }
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const s = await r.json();
    if (s.total_repos) {
      document.getElementById('statChip').innerHTML =
        `📚 <b>${s.total_repos.toLocaleString()}</b> repos · 🚀 <b>${s.breakouts}</b> breakouts`;
    }
  } catch(e){}
}

function hardRefresh() {
  fetch('/api/cache/clear').then(()=>{ top10Data=null; setView(currentView, document.querySelector(`.ntab[data-view="${currentView}"]`)); });
}

// Search
document.getElementById('q').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    if (currentView==='top10' && top10Data) renderTop10(top10Data.data);
  }, 250);
});

// ── LIVE / REAL-TIME VIEW ────────────────────────────────────────────────────
let liveTimer       = null;
let liveLastUpdated = null;

function liveCard(r) {
  const lc   = LANG_CLR[r.language] || '#8b949e';
  const lang = r.language
    ? `<span class="lang-dot" style="color:${lc};background:${lc}18;border:1px solid ${lc}30">● ${r.language}</span>` : '';
  const d1h  = r.delta_1h || 0;
  const d6h  = r.delta_6h || 0;
  const d24h = r.delta_24h || 0;

  const badge1h  = d1h  > 0 ? `<span class="delta-badge delta-pos">▲ ${fmt(d1h)} /1h</span>` :
                               `<span class="delta-badge delta-zero">— /1h</span>`;
  const badge6h  = d6h  > 0 ? `<span class="delta-badge delta-6h">▲ ${fmt(d6h)} /6h</span>` : '';
  const badge24h = d24h > 0 ? `<span class="delta-badge" style="background:rgba(188,140,255,.1);color:var(--purple);border:1px solid rgba(188,140,255,.25)">▲ ${fmt(d24h)} /24h</span>` : '';

  const why = r.why ? `<div class="rc-why">💡 ${r.why}</div>` : '';

  return `
  <a class="rcard ${rankClass(r.rank)} ${d1h>0?'bo':''}" href="${r.url||'#'}" target="_blank" rel="noopener noreferrer">
    <div class="rc-top">
      <span class="rc-rank ${r.rank>3?'other':''}">${rankLabel(r.rank)}</span>
      <img class="av" src="${r.owner_avatar||''}" loading="lazy" onerror="this.remove()">
      <span class="rc-name">${r.full_name}</span>
      ${lang}
    </div>
    <div class="rc-desc">${r.description||'<em style="opacity:.4">No description</em>'}</div>
    <div class="rc-sig">
      <span class="sig stars">⭐ <b>${fmt(r.stars)}</b></span>
      ${badge1h}${badge6h}${badge24h}
    </div>
    ${why}
  </a>`;
}

async function loadLive(silent=false) {
  if (!silent) setPageLoading(8);

  try {
    const resp = await fetch('/api/realtime?limit=100');
    const j    = await resp.json();
    const repos = j.data || [];
    liveLastUpdated = new Date();

    if (j.status === 'no_data') {
      document.getElementById('page').innerHTML = `
        <div class="live-hdr">
          <span class="live-dot"></span>
          <span class="live-title">🔴 Live AI Tracker</span>
          <span class="live-sub">Cron starting — first data in ~5 minutes</span>
        </div>
        <div class="empty">
          <div class="ei">⏳</div>
          <h3>First collection running now</h3>
          <p style="margin-top:8px;color:var(--muted)">Real-time snapshots are being collected. Refresh in 5 minutes.</p>
        </div>`;
      return;
    }

    const movers   = repos.filter(r => (r.delta_1h||0) > 0);
    const watching = repos.filter(r => (r.delta_1h||0) === 0);
    const topGain  = repos[0]?.delta_1h || 0;
    const timeAgo  = liveLastUpdated ? `updated ${Math.round((Date.now()-liveLastUpdated)/1000)}s ago` : '';

    const movSection = movers.length
      ? `<div style="margin-bottom:6px;font-size:11px;font-weight:700;color:var(--red)">🔥 GAINING STARS RIGHT NOW (${movers.length})</div>
         <div class="repo-list" style="margin-bottom:24px">${movers.map(r=>liveCard(r)).join('')}</div>` : '';

    const watchSection = watching.length
      ? `<div style="margin-bottom:6px;font-size:11px;font-weight:700;color:var(--muted)">👁 WATCHING — no movement in last hour (${watching.length})</div>
         <div class="repo-list">${watching.slice(0,30).map(r=>liveCard(r)).join('')}</div>` : '';

    document.getElementById('page').innerHTML = `
      <div class="live-hdr">
        <span class="live-dot"></span>
        <span class="live-title">🔴 Live AI Repo Tracker</span>
        <span class="live-sub">
          ${repos.length} repos tracked ·
          ${movers.length} gaining stars now ·
          top gain: <b style="color:var(--green)">▲${fmt(topGain)}/hr</b>
        </span>
        <span class="live-refresh" id="liveAge">${timeAgo}</span>
      </div>
      ${movSection}${watchSection}`;

    document.getElementById('statChip').innerHTML =
      `🔴 <b>${movers.length}</b> moving · <b>${repos.length}</b> tracked`;

  } catch(e) {
    if (!silent) document.getElementById('page').innerHTML =
      `<div class="empty"><div class="ei">⚠️</div><h3>${e.message}</h3></div>`;
  }
}

function startLiveRefresh() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(async () => {
    if (currentView === 'live') {
      await loadLive(true);   // silent reload — don't flash skeleton
      const el = document.getElementById('liveAge');
      if (el && liveLastUpdated)
        el.textContent = `refreshed ${Math.round((Date.now()-liveLastUpdated)/1000)}s ago`;
    }
  }, 60000);  // refresh every 60s
}

// ── TIMELINE (date-wise view) ────────────────────────────────────────────────
let snapshotDates   = [];
let activeDate      = null;
let activePlatform  = 'github';

async function loadTimeline(forceDate, forcePlatform) {
  // Load available dates once
  if (!snapshotDates.length) {
    try {
      const r = await fetch('/api/snapshot-dates');
      const j = await r.json();
      snapshotDates = j.dates || [];
    } catch(e) { snapshotDates = []; }
  }

  const platform   = forcePlatform || activePlatform || 'github';
  activePlatform   = platform;
  const targetDate = forceDate || activeDate || (snapshotDates[0]?.date) || '2026-05-18';
  activeDate       = targetDate;

  const today      = snapshotDates[0]?.date || targetDate;

  // Platform toggle buttons
  const platformToggle = `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
      <label style="font-size:11px;color:var(--muted);font-weight:600">Platform:</label>
      <button class="dchip ${platform==='github'?'active today':''}" onclick="loadTimeline(activeDate,'github')">🐙 GitHub</button>
      <button class="dchip ${platform==='gitlab'?'active':''}" onclick="loadTimeline(activeDate,'gitlab')">🦊 GitLab</button>
    </div>`;

  // Date chips (only show for GitLab since GitHub uses last_updated)
  const chipsHtml = platform === 'gitlab'
    ? snapshotDates.map(d => {
        const isToday = d.date === today;
        const cls = ['dchip', isToday?'today':'', d.date===activeDate?'active':''].filter(Boolean).join(' ');
        return `<button class="${cls}" onclick="loadTimeline('${d.date}','gitlab')">${d.date}${isToday?' ✦':''} <span style="opacity:.5;font-size:10px">${d.count}</span></button>`;
      }).join('')
    : '';

  const dateBar = platform === 'gitlab'
    ? `<div class="date-bar"><label>📅 Date:</label><div class="date-chips">${chipsHtml}</div></div>`
    : `<div class="date-bar" style="gap:6px"><label>📅 GitHub top repos as of</label><b style="color:var(--green)">${targetDate}</b><span style="color:var(--muted);font-size:10px">(ranked by score · 3,000+ repos)</span></div>`;

  // Skeleton
  document.getElementById('page').innerHTML = `
    ${platformToggle}${dateBar}
    ${Array(8).fill('<div class="sk" style="height:90px;margin-bottom:8px"></div>').join('')}`;

  try {
    const resp = await fetch(`/api/top-by-date?date=${targetDate}&limit=200&platform=${platform}`);
    const j    = await resp.json();
    const repos = j.data || [];

    const breakoutCount = repos.filter(r => r.is_breakout).length;
    const topVel = repos.slice(0,20).reduce((m,r) => Math.max(m, r.delta_7d||0), 0);

    document.getElementById('page').innerHTML = `
      ${platformToggle}${dateBar}
      <div class="tl-meta">
        <b>${repos.length}</b> repos · <b style="color:var(--red)">${breakoutCount} 🚀 breakouts</b>
        ${topVel ? `· fastest mover <b style="color:var(--green)">▲${fmt(topVel)}/wk</b>` : ''}
      </div>
      <div class="repo-list">${repos.map(r => repoCard(r)).join('')}</div>`;

    document.getElementById('statChip').innerHTML =
      `🐙 <b>${platform==='github'?'GitHub':'GitLab'}</b> · <b>${repos.length}</b> repos`;
  } catch(e) {
    document.getElementById('page').innerHTML =
      `${platformToggle}${dateBar}<div class="empty"><div class="ei">⚠️</div><h3>${e.message}</h3></div>`;
  }
}

// Boot
loadStats();
loadTop10();
startLiveRefresh();
</script>
</body>
</html>
